[mod]
id = "minebot_agent"
version = "1.0.0"
priority = 100

# Written against this commit. The bundle adds two modules and hooks two of Horizon's native hook points
# (frame, mods); its glue (glue.rs) reads the game's state the way Horizon's own control commands do.
[compatibility]
horizon_revision = "f8bfa06b90e78e410b05900e15ed5070386e09a0"

# The logic: HTTP API, JSON, formats (also this folder's Cargo library, for its tests).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "minebot_agent"
source = "runtime.rs"

# The game side: world sections, entities, players, registries, control commands.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "minebot_agent_glue"
source = "glue.rs"

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
