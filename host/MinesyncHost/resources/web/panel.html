<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MinesyncHost</title>
<link rel="icon" href="/icon.png">
<style>
:root{--bg:#0b0e14;--card:#131824;--card2:#1a2030;--ink:#eef1f7;--mut:#94a0b6;--line:#252d3d;--acc:#ff8a1f;--acc2:#ffb066;--ok:#2fb36a;--bad:#e5484d;--warn:#f5a524;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
body.light{--bg:#f3f5f9;--card:#fff;--card2:#f1f4f9;--ink:#131823;--mut:#5b667a;--line:#e1e6ef;--shadow:0 10px 30px rgba(20,30,60,.08);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header img{width:40px;height:40px;border-radius:10px}
header h1{font-size:19px;margin:0;line-height:1.2}header small{color:var(--mut)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}.pill.warn{color:var(--warn)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:600 13.5px system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{filter:brightness(1.07)}.btn.bad{color:var(--bad)}.btn.sm{height:32px;padding:0 11px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
input{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:14px system-ui,sans-serif}
input:focus{outline:2px solid color-mix(in srgb,var(--acc) 55%,transparent);border-color:var(--acc)}
label.f{display:grid;gap:5px}label.f span{font-size:12.5px;color:var(--mut);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tab{flex:1;height:34px;border:0;border-radius:9px;background:transparent;color:var(--mut);font:600 13px system-ui,sans-serif;cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.spec{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.spec small{display:block;color:var(--mut);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.spec b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.note{border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);padding:10px 12px;border-radius:8px;font-size:13px}
.big{font-size:22px;font-weight:700;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:11px 16px;border-radius:12px;z-index:50;max-width:92vw}
.toast.bad{border-color:var(--bad);color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(5,8,14,.6);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;display:grid;gap:14px;box-shadow:var(--shadow)}
.modal h3{margin:0;font-size:16px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:560px){header{flex-wrap:wrap}.tab{font-size:12px}}
</style>
</head>
